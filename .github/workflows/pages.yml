name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'guides/**'
      - 'web-proto/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-proto/package-lock.json

      - name: Build wiki
        working-directory: web-proto
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-proto/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy wiki
        id: deployment
        uses: actions/deploy-pages@v4
